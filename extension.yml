schema_version: "1.0"

extension:
  id: epic-framework
  name: "EPIC Framework Spec Quality"
  version: "0.4.0"
  description: "Check Spec Kit artifacts against the EPIC framework, report violations, and optionally revise spec.md to address them"
  author: "VCU SE Center"
  repository: https://github.com/vcu-swim-lab/speckit-epic
  license: MIT
  homepage: https://epicframework.netlify.app/

requires:
  speckit_version: ">=1.4.0"

provides:
  commands:
    - name: speckit.epic-framework.review
      file: commands/speckit.epic-framework.review.md
      description: "Report the parts of the current feature's spec, plan, and tasks that violate EPIC practices, then optionally revise spec.md to address them"

tags:
  - "epic"
  - "quality"
  - "review"
  - "spec"
